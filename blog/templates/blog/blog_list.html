{% extends 'blog/base.html' %}

{% block title %}Все посты{% endblock %}

{% block content %}
{% include 'blog/header.html' %}

 <div class="container mt-5">
        <h1 class="mb-4">Список постов</h1>
        <a href="{% url 'blog:blog_create' %}" class="btn btn-primary mb-3">Создать новый пост</a>
        <ul class="list-group">
            {% for blog in blogs %}
                <li class="list-group-item">
                    <a href="{% url 'blog:blog_detail' blog_id=blog.pk %}">{{ blog.title }}</a>
                    <a href="{% url 'blog:blog_update' blog_id=blog.pk %}" class="btn btn-sm btn-secondary ml-3">Редактировать</a>
                    <a href="{% url 'blog:blog_delete' blog_id=blog.pk %}" class="btn btn-sm btn-danger ml-1">Удалить</a>
                </li>
            {% endfor %}
        </ul>
    </div>
{% endblock %}
