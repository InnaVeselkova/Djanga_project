<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Управление каталогом{% endblock %}</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
     <h5 class="my-0 mr-md-auto font-weight-normal">Магазин</h5>
        <nav class="ms-5">
            <a class="p-2 btn btn-outline-primary" href="/home">Каталог</a>
            <a class="p-2 btn btn-outline-primary" href="/contacts/">Контакты</a>
            <a class="p-2 btn btn-outline-primary" href="/blog/list">Список постов</a>
            {% if user.is_authenticated %}
                    <li class="p-2 btn btn-outline-primary">
	                    <form method="post" action="{% url 'users:logout' %}" style="display: inline;">
	                        {% csrf_token %}
	                        <button type="submit" class="btn btn-link nav-link">Выйти
	                        </button>
	                    </form>
	                </li>
                {% else %}
                    <li class="p-2 btn btn-outline-primary">
                        <a class="nav-link" href="{% url 'users:login' %}">Войти</a>
                    </li>
                    <li class="p-2 btn btn-outline-primary">
                        <a class="nav-link" href="{% url 'users:register' %}">Регистрация</a>
                    </li>
                {% endif %}
        </nav>
    </div>
    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
