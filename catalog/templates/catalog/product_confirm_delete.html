{% extends 'catalog/base.html' %}

{% block title %}Наши товары{% endblock %}

{% block content %}
{% include 'catalog/header.html' %}

<h1>Подтверждение удаления</h1>
<p>Вы уверены, что хотите удалить этот продукт?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'catalog:product_detail' product_id=object.pk %}">Отмена</a>
</form>
{% endblock %}
